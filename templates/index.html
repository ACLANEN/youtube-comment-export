<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 评论搜索导出</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
h1 { font-size: 24px; margin-bottom: 8px; }
.sub { color: #aaa; font-size: 14px; margin-bottom: 24px; }
.search-box { display: flex; gap: 10px; margin-bottom: 32px; }
.search-box input { flex: 1; padding: 14px 18px; border: 1px solid #333; border-radius: 10px; font-size: 16px; background: #1a1a1a; color: #fff; outline: none; transition: border .2s; }
.search-box input:focus { border-color: #ff4444; }
.search-box button { padding: 14px 28px; background: #ff4444; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background .2s; }
.search-box button:hover { background: #e63939; }
.search-box button:disabled { opacity: .5; cursor: not-allowed; }
.spinner { display: none; text-align: center; padding: 40px; color: #aaa; }
.spinner.active { display: block; }
.spinner::after { content: ""; display: inline-block; width: 28px; height: 28px; border: 3px solid #333; border-top-color: #ff4444; border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.video-table { width: 100%; border-collapse: collapse; display: none; }
.video-table.active { display: table; }
.video-table th { text-align: left; padding: 10px 12px; border-bottom: 1px solid #222; color: #aaa; font-size: 12px; font-weight: 500; text-transform: uppercase; }
.video-table td { padding: 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; vertical-align: middle; }
.video-table tr:hover td { background: #1a1a1a; }
.video-table .cb { width: 36px; }
.video-table .views { width: 80px; color: #aaa; }
.video-table .cmts { width: 70px; color: #aaa; }
.video-table input[type="checkbox"] { width: 16px; height: 16px; accent-color: #ff4444; cursor: pointer; }
.title-cell { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.export-bar { display: none; position: sticky; bottom: 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 16px 20px; margin-top: 24px; align-items: center; justify-content: space-between; }
.export-bar.active { display: flex; }
.export-bar .count { color: #ff4444; font-weight: 600; }
.export-bar button { padding: 12px 32px; background: #ff4444; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
.export-bar button:hover { background: #e63939; }
.export-bar button:disabled { opacity: .5; cursor: not-allowed; }
.select-all { color: #ff4444; cursor: pointer; font-size: 13px; user-select: none; }
.select-all:hover { text-decoration: underline; }
.error { color: #ff4444; padding: 12px; display: none; }
.error.active { display: block; }
.zero-cmts { color: #555; }
</style>
</head>
<body>
<div class="container">
  <h1>🎬 YouTube 评论搜索导出</h1>
  <p class="sub">输入关键词 → 按播放量排序 → 选视频 → 一键导出 CSV</p>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="输入关键词，如 cfmoto zforce z10" autofocus>
    <button id="searchBtn" onclick="doSearch()">搜索</button>
  </div>

  <div class="error" id="error"></div>
  <div class="spinner" id="spinner"></div>

  <table class="video-table" id="videoTable">
    <thead>
      <tr>
        <th class="cb"><span class="select-all" onclick="toggleAll()">全选</span></th>
        <th class="views">播放量</th>
        <th class="cmts">评论</th>
        <th>标题</th>
        <th>频道</th>
      </tr>
    </thead>
    <tbody id="videoBody"></tbody>
  </table>

  <div class="export-bar" id="exportBar">
    <span>已选 <span class="count" id="selectedCount">0</span> 个视频</span>
    <button id="exportBtn" onclick="doExport()">导出 CSV</button>
  </div>
</div>

<script>
let videos = [];

async function doSearch() {
  const kw = document.getElementById("keyword").value.trim();
  if (!kw) return;

  setState("loading");
  try {
    const resp = await fetch(`/api/search?q=${encodeURIComponent(kw)}`);
    const data = await resp.json();
    if (data.error) { showError(data.error); return; }
    videos = data.videos || [];
    renderTable();
    setState(videos.length ? "results" : "empty");
    if (!videos.length) showError("未找到相关视频");
  } catch (e) {
    showError("搜索失败: " + e.message);
    setState("empty");
  }
}

function renderTable() {
  const tbody = document.getElementById("videoBody");
  tbody.innerHTML = videos.map((v, i) => `
    <tr>
      <td><input type="checkbox" value="${i}" onchange="updateBar()" ${v.comment_count === 0 ? "disabled" : ""}></td>
      <td class="views">${fmt(v.view_count)}</td>
      <td class="cmts ${v.comment_count === 0 ? 'zero-cmts' : ''}">${v.comment_count === 0 ? '无' : fmt(v.comment_count)}</td>
      <td class="title-cell" title="${esc(v.title)}">${esc(v.title)}</td>
      <td>${esc(v.channel)}</td>
    </tr>
  `).join("");
  updateBar();
}

function updateBar() {
  const cbs = document.querySelectorAll("#videoBody input[type='checkbox']:checked");
  const count = cbs.length;
  document.getElementById("selectedCount").textContent = count;
  document.getElementById("exportBar").classList.toggle("active", count > 0);
}

function toggleAll() {
  const cbs = document.querySelectorAll("#videoBody input[type='checkbox']:not(:disabled)");
  const allChecked = [...cbs].every(cb => cb.checked);
  cbs.forEach(cb => cb.checked = !allChecked);
  updateBar();
}

async function doExport() {
  const checked = document.querySelectorAll("#videoBody input[type='checkbox']:checked");
  const ids = [...checked].map(cb => videos[cb.value].video_id);
  if (!ids.length) return;

  const btn = document.getElementById("exportBtn");
  btn.disabled = true;
  btn.textContent = "导出中...";

  try {
    const resp = await fetch("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video_ids: ids }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      showError(err.error || "导出失败");
      return;
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `youtube_comments_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    showError("导出失败: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "导出 CSV";
  }
}

function setState(state) {
  document.getElementById("spinner").classList.toggle("active", state === "loading");
  document.getElementById("videoTable").classList.toggle("active", state === "results");
  document.getElementById("error").classList.remove("active");
  if (state !== "results") document.getElementById("exportBar").classList.remove("active");
}

function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg;
  el.classList.add("active");
}

function fmt(n) { return n >= 10000 ? (n/10000).toFixed(1) + "万" : n.toLocaleString(); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

document.getElementById("keyword").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
</script>
</body>
</html>
