<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 评论搜索导出</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); color: #e0e0e0; min-height: 100vh; }
.container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }

/* 头部 */
.header { text-align: center; margin-bottom: 28px; }
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.header h1 span { background: linear-gradient(135deg, #ff4444, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .sub { color: #666; font-size: 13px; }

/* 搜索框 */
.search-wrap { position: relative; margin-bottom: 28px; }
.search-wrap input { width: 100%; padding: 16px 56px 16px 20px; border: 2px solid #1e1e1e; border-radius: 14px; font-size: 16px; background: #111; color: #fff; outline: none; transition: all .25s; }
.search-wrap input:focus { border-color: #ff4444; box-shadow: 0 0 0 4px rgba(255,68,68,.12); }
.search-wrap input::placeholder { color: #444; }
.search-wrap button { position: absolute; right: 8px; top: 8px; bottom: 8px; padding: 0 24px; background: linear-gradient(135deg, #ff4444, #e63939); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; }
.search-wrap button:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,68,68,.3); }
.search-wrap button:disabled { opacity: .4; transform: none; box-shadow: none; cursor: not-allowed; }

/* 状态 */
.status-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; min-height: 28px; }
.status-bar .msg { font-size: 13px; color: #666; }
.status-bar .msg.success { color: #4caf50; }
.status-bar .msg.error { color: #ff4444; }
.status-bar .actions { display: none; align-items: center; gap: 12px; }
.status-bar .actions.visible { display: flex; }
.status-bar .select-all { color: #ff4444; font-size: 13px; cursor: pointer; user-select: none; }
.status-bar .select-all:hover { text-decoration: underline; }

/* spinner */
.spinner { display: none; text-align: center; padding: 50px 0; }
.spinner.active { display: block; }
.spinner .dot-pulse { display: inline-flex; gap: 6px; }
.spinner .dot-pulse span { width: 10px; height: 10px; background: #ff4444; border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
.spinner .dot-pulse span:nth-child(1) { animation-delay: 0s; }
.spinner .dot-pulse span:nth-child(2) { animation-delay: .15s; }
.spinner .dot-pulse span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }

/* 视频列表 */
.video-list { display: none; flex-direction: column; gap: 6px; }
.video-list.active { display: flex; }

.video-card { background: #12121a; border: 1px solid #1a1a28; border-radius: 12px; overflow: hidden; transition: all .2s; }
.video-card:hover { border-color: #2a2a3a; background: #141420; }
.video-card.selected { border-color: #ff4444; background: #1a1216; }

.video-card-main { display: flex; align-items: center; padding: 10px 14px; gap: 12px; cursor: pointer; }
.video-card .cb-wrap { flex-shrink: 0; }
.video-card .cb-wrap input { width: 17px; height: 17px; accent-color: #ff4444; cursor: pointer; }
.video-card .thumb { flex-shrink: 0; width: 100px; height: 56px; border-radius: 6px; object-fit: cover; background: #1a1a2e; }
.video-card .info { flex: 1; min-width: 0; }
.video-card .info .title { font-size: 14px; font-weight: 500; color: #e8e8e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.video-card .info .meta { font-size: 11px; color: #666; display: flex; gap: 10px; }
.video-card .info .meta .channel { color: #888; }
.video-card .stats { flex-shrink: 0; display: flex; gap: 14px; font-size: 12px; color: #777; text-align: right; }
.video-card .stats .views { font-weight: 500; color: #aaa; }
.video-card .stats .cmts { font-weight: 500; }
.video-card .stats .cmts.zero { color: #444; }
.video-card .expand-arrow { flex-shrink: 0; color: #444; font-size: 14px; transition: transform .2s; width: 20px; text-align: center; }
.video-card.expanded .expand-arrow { transform: rotate(180deg); color: #ff4444; }

/* 评论预览 */
.comment-preview { display: none; border-top: 1px solid #1a1a28; padding: 0; max-height: 0; overflow: hidden; transition: max-height .35s ease, padding .35s ease; }
.video-card.expanded .comment-preview { display: block; max-height: 500px; overflow-y: auto; padding: 6px 14px 12px; }
.comment-preview .comment-row { padding: 8px 0; border-bottom: 1px solid #111; display: flex; gap: 10px; font-size: 12px; }
.comment-preview .comment-row:last-child { border-bottom: none; }
.comment-preview .comment-row .c-avatar { width: 24px; height: 24px; border-radius: 50%; background: #2a2a3a; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666; }
.comment-preview .comment-row .c-body { flex: 1; min-width: 0; }
.comment-preview .comment-row .c-author { font-weight: 600; color: #ccc; margin-bottom: 2px; }
.comment-preview .comment-row .c-text { color: #999; line-height: 1.5; word-break: break-word; }
.comment-preview .comment-row .c-likes { color: #555; font-size: 11px; flex-shrink: 0; }
.comment-preview .more-hint { text-align: center; color: #444; font-size: 11px; padding: 6px 0; }

/* 导出按钮 */
.export-bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 16px; background: #1a1a2e; border: 1px solid #ff4444; border-radius: 14px; padding: 14px 24px; box-shadow: 0 8px 32px rgba(0,0,0,.5); z-index: 100; }
.export-bar.visible { display: flex; }
.export-bar .count { color: #ff4444; font-weight: 700; }
.export-bar button { padding: 12px 36px; background: linear-gradient(135deg, #ff4444, #e63939); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; }
.export-bar button:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,68,68,.3); }
.export-bar button:disabled { opacity: .4; transform: none; box-shadow: none; cursor: not-allowed; }

/* 响应式 */
@media (max-width: 640px) {
  .container { padding: 16px 12px; }
  .header h1 { font-size: 22px; }
  .video-card .thumb { width: 70px; height: 40px; }
  .video-card .info .title { font-size: 12px; }
  .video-card .stats { font-size: 10px; gap: 8px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎬 YouTube <span>评论抓取</span></h1>
    <p class="sub">搜索视频 → 按播放量排序 → 预览评论 → 一键导出 CSV</p>
  </div>

  <div class="search-wrap">
    <input type="text" id="keyword" placeholder="输入关键词，如 cfmoto zforce z10" autofocus>
    <button id="searchBtn" onclick="doSearch()">搜索</button>
  </div>

  <div class="status-bar">
    <span class="msg" id="statusMsg">就绪</span>
    <div class="actions" id="actionsBar">
      <span class="select-all" onclick="toggleAll()">全选</span>
      <span style="color:#444">|</span>
      <button class="select-all" onclick="doExport()" style="font-weight:600;border:none;background:none;font-size:13px;">⬇ 导出 CSV</button>
    </div>
  </div>

  <div class="spinner" id="spinner">
    <div class="dot-pulse"><span></span><span></span><span></span></div>
  </div>

  <div class="video-list" id="videoList"></div>
</div>

<div class="export-bar" id="exportBar">
  <span>已选 <span class="count" id="selectedCount">0</span> 个视频</span>
  <button id="exportBtn" onclick="doExport()">导出 CSV</button>
</div>

<script>
let videos = [];
let previewCache = {};

async function doSearch() {
  const kw = document.getElementById("keyword").value.trim();
  if (!kw) return;

  setState("loading");
  setStatus("搜索中...");
  try {
    const resp = await fetch(`/api/search?q=${encodeURIComponent(kw)}`);
    const data = await resp.json();
    if (data.error) { setStatus(data.error, "error"); setState("empty"); return; }
    videos = data.videos || [];
    previewCache = {};
    renderCards();
    setState(videos.length ? "results" : "empty");
    setStatus(videos.length ? `找到 ${videos.length} 个视频，按播放量降序` : "未找到相关视频", videos.length ? "success" : "error");
  } catch (e) {
    setStatus("搜索失败: " + e.message, "error");
    setState("empty");
  }
}

function renderCards() {
  const container = document.getElementById("videoList");
  container.innerHTML = videos.map((v, i) => `
    <div class="video-card" id="card-${i}">
      <div class="video-card-main" onclick="togglePreview(${i}, event)">
        <div class="cb-wrap" onclick="event.stopPropagation()">
          <input type="checkbox" ${v.comment_count===0?'disabled':''} onchange="onCheck(${i}, this.checked)">
        </div>
        <img class="thumb" src="${v.thumbnail}" loading="lazy" onerror="this.style.display='none'">
        <div class="info">
          <div class="title" title="${esc(v.title)}">${esc(v.title)}</div>
          <div class="meta">
            <span class="channel">${esc(v.channel)}</span>
          </div>
        </div>
        <div class="stats">
          <span class="views">▶ ${fmt(v.view_count)}</span>
          <span class="cmts ${v.comment_count===0?'zero':''}">💬 ${v.comment_count===0?'无':fmt(v.comment_count)}</span>
        </div>
        <div class="expand-arrow">▾</div>
      </div>
      <div class="comment-preview" id="preview-${i}">
        <div style="color:#555;font-size:12px;padding:8px 0;">加载中...</div>
      </div>
    </div>
  `).join("");
  updateUI();
}

async function togglePreview(i, event) {
  if (event.target.tagName === 'INPUT') return;
  const card = document.getElementById("card-" + i);
  const wasExpanded = card.classList.contains("expanded");

  // collapse all
  document.querySelectorAll(".video-card.expanded").forEach(c => c.classList.remove("expanded"));

  if (!wasExpanded) {
    card.classList.add("expanded");
    if (!previewCache[i]) {
      await loadPreview(i);
    }
  }
}

async function loadPreview(i) {
  const v = videos[i];
  const previewDiv = document.getElementById("preview-" + i);
  try {
    const resp = await fetch("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video_ids: [v.video_id], preview: true }),
    });
    if (!resp.ok) {
      previewDiv.innerHTML = '<div style="color:#555;font-size:12px;padding:8px 0;">无法加载评论</div>';
      return;
    }
    const data = await resp.json();
    if (!data.comments || data.comments.length === 0) {
      previewDiv.innerHTML = '<div style="color:#555;font-size:12px;padding:8px 0;">暂无评论</div>';
      return;
    }
    previewCache[i] = data.comments;
    const top5 = data.comments.slice(0, 5);
    previewDiv.innerHTML = top5.map(c => `
      <div class="comment-row">
        <div class="c-avatar">${c.author[0].toUpperCase()}</div>
        <div class="c-body">
          <div class="c-author">${esc(c.author)}</div>
          <div class="c-text">${esc(c.text.replace(/<br>/g,' '))}</div>
        </div>
        <div class="c-likes">👍 ${c.likes}</div>
      </div>
    `).join('') + (data.comments.length > 5 ? `<div class="more-hint">... 还有 ${data.comments.length - 5} 条评论</div>` : '');
  } catch (e) {
    previewDiv.innerHTML = '<div style="color:#555;font-size:12px;padding:8px 0;">加载失败</div>';
  }
}

function onCheck(i, checked) {
  const card = document.getElementById("card-" + i);
  card.classList.toggle("selected", checked);
  updateUI();
}

function toggleAll() {
  const cbs = document.querySelectorAll("#videoList input[type='checkbox']:not(:disabled)");
  const allChecked = [...cbs].every(cb => cb.checked);
  cbs.forEach(cb => { cb.checked = !allChecked; cb.dispatchEvent(new Event("change")); });
  document.querySelectorAll(".video-card").forEach(c => {
    const cb = c.querySelector('input[type="checkbox"]');
    c.classList.toggle("selected", cb && cb.checked);
  });
  updateUI();
}

function updateUI() {
  const cbs = document.querySelectorAll("#videoList input[type='checkbox']:checked");
  const count = cbs.length;
  document.getElementById("selectedCount").textContent = count;
  document.getElementById("exportBar").classList.toggle("visible", count > 0);
  document.getElementById("actionsBar").classList.toggle("visible", videos.length > 0);
}

async function doExport() {
  const checked = document.querySelectorAll("#videoList input[type='checkbox']:checked");
  const ids = [...checked].map(cb => videos[cb.value].video_id);
  if (!ids.length) return;

  const btn = document.getElementById("exportBtn");
  btn.disabled = true;
  btn.textContent = "导出中...";
  setStatus("正在获取评论...");

  try {
    const resp = await fetch("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video_ids: ids }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      setStatus(err.error || "导出失败", "error");
      return;
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `youtube_comments_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    setStatus(`✅ 导出完成`, "success");
  } catch (e) {
    setStatus("导出失败: " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "导出 CSV";
  }
}

function setState(state) {
  document.getElementById("spinner").classList.toggle("active", state === "loading");
  document.getElementById("videoList").classList.toggle("active", state === "results");
  document.getElementById("exportBar").classList.toggle("visible", false);
  document.getElementById("actionsBar").classList.toggle("visible", false);
}

function setStatus(msg, cls) {
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.className = "msg " + (cls || "");
}

function fmt(n) { return n >= 10000 ? (n/10000).toFixed(1) + "万" : n.toLocaleString(); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

document.getElementById("keyword").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
</script>
</body>
</html>
