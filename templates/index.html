<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comment Research — YouTube 评论调研工具</title>
<meta name="description" content="快速获取 YouTube 视频评论数据。搜索视频、抓取评论、一键导出 CSV/Excel，用真实用户反馈支持市场调研。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>💬</text></svg>">
<style>
/* ====== Reset & Variables ====== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d0d0d; --surface: #141414; --surface-raised: #1a1a1a;
  --border: #262626; --border-hover: #333;
  --text: #f5f5f5; --text-secondary: #a3a3a3; --text-tertiary: #737373;
  --accent: #2383e2; --accent-hover: #1a6fc4; --accent-subtle: rgba(35,131,226,.08);
  --green: #30a46c; --red: #e5484d;
  --radius-sm: 6px; --radius: 8px; --radius-lg: 12px;
}
html { scroll-behavior: smooth; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1 { font-size: 48px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.1; }
h2 { font-size: 32px; font-weight: 600; letter-spacing: -0.8px; }
h3 { font-size: 18px; font-weight: 600; }
p, li { font-size: 16px; color: var(--text-secondary); }
.container { max-width: 1080px; margin: 0 auto; padding: 0 32px; }
.section { padding: 80px 0; }

/* ====== Nav ====== */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13,13,13,.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.nav .container { display: flex; align-items: center; justify-content: space-between; height: 56px; }
.nav .logo { font-weight: 700; font-size: 15px; color: var(--text); letter-spacing: -0.3px; }
.nav .logo span { color: var(--accent); font-weight: 600; }
.nav .nav-btn { font-size: 13px; color: var(--text-secondary); text-decoration: none; padding: 6px 16px; border-radius: var(--radius-sm); transition: all .15s; border: 1px solid var(--border); }
.nav .nav-btn:hover { background: var(--surface-raised); color: var(--text); }

/* ====== Hero ====== */
.hero { padding: 160px 0 80px; text-align: center; }
.hero h1 { margin-bottom: 16px; max-width: 720px; margin-left: auto; margin-right: auto; }
.hero .subtitle { font-size: 18px; color: var(--text-secondary); max-width: 540px; margin: 0 auto 40px; line-height: 1.6; }
.hero .cta-group { display: flex; gap: 12px; justify-content: center; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s; text-decoration: none; border: none; letter-spacing: -0.2px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface-raised); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--border-hover); background: #1f1f1f; }

/* ====== Features ====== */
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 48px; }
.feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; transition: border-color .15s; }
.feature-card:hover { border-color: var(--border-hover); }
.feature-card .icon { font-size: 24px; margin-bottom: 16px; }
.feature-card h3 { margin-bottom: 8px; }
.feature-card p { font-size: 14px; color: var(--text-tertiary); line-height: 1.6; }

/* ====== Search Section ====== */
.search-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; margin-top: 32px; }
.search-row { display: flex; gap: 12px; }
.search-row input { flex: 1; padding: 14px 18px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 16px; background: var(--bg); color: var(--text); outline: none; transition: border-color .15s; }
.search-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
.search-row input::placeholder { color: #404040; }
.search-row button { padding: 14px 28px; }

/* ====== Empty ====== */
.empty-hints { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; justify-content: center; }
.empty-hints span { font-size: 13px; color: var(--text-tertiary); background: var(--bg); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; transition: all .15s; }
.empty-hints span:hover { border-color: var(--accent); color: var(--accent); }

/* ====== Card Entrance Animation ====== */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.video-card { animation: cardIn .35s ease both; }

/* ====== Toast ====== */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: var(--surface-raised); border: 1px solid var(--green);
  color: var(--green); padding: 12px 28px; border-radius: var(--radius);
  font-size: 14px; font-weight: 500; z-index: 200;
  animation: toastIn .3s ease, toastOut .3s ease 2s forwards;
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

/* ====== Step Indicator ====== */
.export-steps { display: flex; gap: 24px; font-size: 12px; color: var(--text-tertiary); }
.export-steps .step { display: flex; align-items: center; gap: 6px; }
.export-steps .step .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all .3s; }
.export-steps .step.active .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.export-steps .step.done .dot { background: var(--green); }
.export-steps .step.done { color: var(--green); }

/* ====== Results ====== */
.results-area { display: none; margin-top: 24px; }
.results-area.active { display: block; }
.results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; min-height: 32px; }
.results-header .count { font-size: 14px; color: var(--text-tertiary); }
.results-header .select-all { font-size: 13px; color: var(--accent); cursor: pointer; background: none; border: none; }
.results-header .select-all:hover { text-decoration: underline; }

/* ====== Filter Row ====== */
.filter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; }
.filter-row label { color: var(--text-tertiary); }
.filter-row select, .filter-row input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: var(--radius-sm); font-size: 13px; outline: none; }
.filter-row select:focus, .filter-row input:focus { border-color: var(--accent); }
.filter-row input[type="number"] { width: 70px; }

/* ====== Video Cards ====== */
.video-list { display: flex; flex-direction: column; gap: 8px; }
.video-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: border-color .15s; }
.video-card:hover { border-color: var(--border-hover); }
.video-card.selected { border-color: var(--accent); background: rgba(35,131,226,.03); }
.card-main { display: flex; align-items: center; padding: 14px 20px; gap: 16px; cursor: pointer; }
.card-main .cb-wrap input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
.card-main .thumb { width: 120px; height: 68px; border-radius: var(--radius-sm); object-fit: cover; background: #1a1a1a; flex-shrink: 0; }
.card-main .info { flex: 1; min-width: 0; }
.card-main .info .title { font-size: 15px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
.card-main .info .meta { font-size: 13px; color: var(--text-tertiary); display: flex; gap: 16px; align-items: center; }
.card-main .info .meta .duration { background: #1a1a1a; padding: 1px 6px; border-radius: 3px; font-size: 11px; color: #999; }
.card-main .stats { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 13px; }
.card-main .stats .views { color: var(--text-secondary); font-weight: 500; }
.card-main .stats .cmts { color: var(--text-tertiary); }
.card-main .stats .cmts.zero { color: #3d3d3d; }
.card-main .expand-arrow { flex-shrink: 0; color: #3d3d3d; font-size: 14px; transition: transform .2s; }
.video-card.expanded .expand-arrow { transform: rotate(180deg); color: var(--accent); }

/* Comment Preview */
.comment-preview { display: none; border-top: 1px solid var(--border); }
.video-card.expanded .comment-preview { display: block; max-height: 440px; overflow-y: auto; }
.comment-preview .preview-header { padding: 12px 20px 8px; font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .5px; }
.comment-preview .c-item { display: flex; gap: 12px; padding: 10px 20px; border-bottom: 1px solid rgba(255,255,255,.02); font-size: 13px; }
.comment-preview .c-item:last-child { border-bottom: none; }
.comment-preview .c-avatar { width: 26px; height: 26px; border-radius: 50%; background: #1e1e1e; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--text-tertiary); }
.comment-preview .c-body { flex: 1; min-width: 0; }
.comment-preview .c-author { font-weight: 600; color: #ccc; margin-bottom: 2px; font-size: 12px; }
.comment-preview .c-text { color: var(--text-secondary); line-height: 1.5; word-break: break-word; }
.comment-preview .c-likes { color: #4a4a4a; font-size: 11px; flex-shrink: 0; margin-left: 8px; }
.comment-preview .more-hint { text-align: center; color: #3d3d3d; font-size: 11px; padding: 10px 0; }

/* ====== Load More ====== */
.load-more-wrap { display: none; text-align: center; padding: 24px 0; }
.load-more-wrap.active { display: block; }
.load-more-btn { padding: 12px 48px; background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); border-radius: var(--radius); font-size: 14px; cursor: pointer; transition: all .15s; }
.load-more-btn:hover { border-color: var(--accent); color: var(--accent); }
.load-more-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ====== Loading ====== */
.loading-block { display: none; text-align: center; padding: 48px 0; }
.loading-block.active { display: block; }
.loading-dots { display: inline-flex; gap: 5px; }
.loading-dots span { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: dotPulse 1.4s infinite ease-in-out; }
.loading-dots span:nth-child(1) { animation-delay: 0s; }
.loading-dots span:nth-child(2) { animation-delay: .16s; }
.loading-dots span:nth-child(3) { animation-delay: .32s; }
@keyframes dotPulse { 0%, 80%, 100% { transform: scale(.3); opacity: .2; } 40% { transform: scale(1); opacity: 1; } }

/* ====== Export Bar ====== */
.export-bar {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  display: none; align-items: center; gap: 16px;
  background: var(--surface-raised); border: 1px solid var(--border-hover);
  border-radius: var(--radius-lg); padding: 14px 24px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5);
  z-index: 100;
}
.export-bar.visible { display: flex; flex-wrap: wrap; }
.export-bar .badge { background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 4px; font-size: 13px; font-weight: 600; }
.export-bar .label { color: var(--text-secondary); font-size: 13px; }
.export-bar .stat-item { font-size: 12px; color: var(--text-tertiary); }
.export-bar .stat-item strong { color: var(--text-secondary); }
.export-bar .export-normal { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.export-bar select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; outline: none; cursor: pointer; }

/* ====== Data Preview ====== */
.preview-table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.preview-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.preview-table th { text-align: left; padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .5px; }
.preview-table td { padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,.03); color: var(--text-secondary); }
.preview-table tr:last-child td { border-bottom: none; }
.preview-table td:first-child { color: var(--text); font-weight: 500; }

/* ====== Workflow ====== */
.workflow-steps { display: flex; justify-content: center; align-items: center; gap: 0; flex-wrap: wrap; margin-top: 48px; }
.workflow-step { text-align: center; padding: 0 24px; }
.workflow-step .step-num { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-weight: 700; font-size: 15px; color: var(--accent); }
.workflow-step .step-label { font-size: 14px; color: var(--text-secondary); }
.workflow-arrow { color: var(--border-hover); font-size: 20px; padding: 0 8px; margin-bottom: 28px; }

/* ====== Footer ====== */
.footer { border-top: 1px solid var(--border); padding: 40px 0; text-align: center; }
.footer .text-sm { font-size: 13px; }
.footer .brand { color: var(--text); font-weight: 600; }
.footer .divider { margin: 0 10px; color: #2d2d2d; }

/* ====== Responsive ====== */
@media (max-width: 768px) {
  h1 { font-size: 32px; letter-spacing: -0.8px; }
  h2 { font-size: 24px; }
  .hero { padding: 120px 0 48px; }
  .section { padding: 48px 0; }
  .container { padding: 0 20px; }
  .feature-grid { grid-template-columns: 1fr; }
  .card-main { padding: 12px 14px; gap: 10px; }
  .card-main .thumb { width: 80px; height: 45px; }
  .card-main .info .title { font-size: 13px; }
  .search-row { flex-direction: column; }
  .workflow-steps { flex-direction: column; }
  .workflow-arrow { transform: rotate(90deg); margin: 4px 0; }
  .export-bar { left: 12px; right: 12px; transform: none; }
}


</script>

</body>
</html>
