<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理面板 — Comment Research</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--surface:#141414;--surface2:#1a1a1a;
  --border:#262626;--border2:#333;
  --text:#f5f5f5;--text2:#a3a3a3;--text3:#737373;
  --accent:#2383e2;--green:#30a46c;--red:#e5484d;
  --radius:8px;
}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:16px;letter-spacing:-.3px}
header h1 span{color:var(--accent)}
header a{color:var(--text3);text-decoration:none;font-size:13px}
header a:hover{color:var(--text)}
main{max-width:900px;margin:0 auto;padding:40px 32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card h3{margin-bottom:16px;font-size:16px}
input,select,button{font-family:inherit}
input,select{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:var(--bg);color:var(--text);outline:none;width:100%}
input:focus{border-color:var(--accent)}
.btn{padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}.btn-danger:hover{background:rgba(229,72,77,.1)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:12px;align-items:flex-end}.row>div{flex:1}
.row label{display:block;font-size:13px;color:var(--text3);margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text3);font-weight:500}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03)}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-active{background:rgba(48,164,108,.12);color:var(--green)}
.badge-inactive{background:rgba(229,72,77,.08);color:var(--red)}
.badge-expired{background:rgba(115,115,115,.1);color:var(--text3)}
code{background:var(--bg);padding:2px 8px;border-radius:4px;font-size:13px;letter-spacing:1px}
#loginBox{max-width:360px;margin:120px auto;text-align:center}
#loginBox input{text-align:center;font-size:16px;letter-spacing:2px}
#loginBox .err{color:var(--red);font-size:13px;margin-top:8px;min-height:20px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);padding:10px 24px;border-radius:var(--radius);font-size:14px;z-index:99}
.hidden{display:none!important}
@media(max-width:768px){.row{flex-direction:column}main{padding:24px 16px}}
</style>
</head>
<body>

<!-- Login -->
<div id="loginBox">
  <h2 style="margin-bottom:8px">管理面板</h2>
  <p style="color:var(--text3);font-size:14px;margin-bottom:20px">Comment Research by Fynn</p>
  <input type="password" id="adminPw" placeholder="管理员密码" autofocus>
  <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="login()">登 录</button>
  <p class="err" id="loginErr"></p>
</div>

<!-- Main Panel -->
<div id="panel" class="hidden">
  <header>
    <h1>Comment Research <span>by Fynn</span> — 管理面板</h1>
    <a href="/" target="_blank">← 返回网站</a>
  </header>
  <main>
    <!-- Create Code -->
    <div class="card">
      <h3>创建激活码</h3>
      <div class="row">
        <div><label>备注</label><input type="text" id="newNote" placeholder="例如：张三 / 试用7天"></div>
        <div><label>有效期（天）</label><input type="number" id="newDays" value="30" min="1"></div>
        <div style="flex:0;padding-top:24px"><button class="btn btn-primary" onclick="createCode()">生成激活码</button></div>
      </div>
    </div>

    <!-- Code List -->
    <div class="card">
      <h3>激活码列表 <span style="font-size:12px;color:var(--text3);font-weight:400" id="codeCount"></span></h3>
      <table>
        <thead><tr><th>激活码</th><th>备注</th><th>创建时间</th><th>到期时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="codeTable"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
var SESSION = "";

function login() {
  var pw = document.getElementById("adminPw").value;
  fetch("/api/admin/login", {
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:pw})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){SESSION=d.token;document.getElementById("loginBox").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");loadCodes()}
    else{document.getElementById("loginErr").textContent=d.error}
  });
}

document.getElementById("adminPw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

function loadCodes() {
  fetch("/api/admin/codes").then(r=>r.json()).then(d=>{
    document.getElementById("codeCount").textContent="("+d.codes.length+" 个)";
    var html="";
    d.codes.forEach(function(c){
      var now=new Date();
      var expired=c.expires_at&&new Date(c.expires_at)<now;
      var statusBadge;
      if(c.used) statusBadge='<span class="badge badge-expired">已使用</span>';
      else if(!c.active) statusBadge='<span class="badge badge-inactive">已禁用</span>';
      else if(expired) statusBadge='<span class="badge badge-expired">已过期</span>';
      else statusBadge='<span class="badge badge-active">生效中</span>';

      var created=c.created_at?c.created_at.slice(0,16).replace("T"," "):"—";
      var expires=c.expires_at?c.expires_at.slice(0,16).replace("T"," "):"永不过期";

      html+="<tr>"+
        "<td><code>"+c.code+"</code></td>"+
        "<td>"+(c.note||"—")+"</td>"+
        "<td>"+created+"</td>"+
        "<td>"+expires+"</td>"+
        "<td>"+statusBadge+"</td>"+
        "<td style='display:flex;gap:6px'>"+
          "<button class='btn btn-sm btn-outline' onclick='renewCode(\""+c.code+"\")'>续期</button>"+
          "<button class='btn btn-sm btn-outline' onclick='toggleCode(\""+c.code+"\")'>"+(c.active?"禁用":"启用")+"</button>"+
          "<button class='btn btn-sm btn-danger' onclick='deleteCode(\""+c.code+"\")'>删除</button>"+
        "</td></tr>";
    });
    document.getElementById("codeTable").innerHTML=html||'<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:32px">暂无激活码</td></tr>';
  });
}

function createCode() {
  var note=document.getElementById("newNote").value;
  var days=document.getElementById("newDays").value;
  fetch("/api/admin/codes/create",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({note:note,days:parseInt(days)})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){document.getElementById("newNote").value="";showToast("激活码: "+d.code);loadCodes()}
    else{showToast("创建失败")}
  });
}

function toggleCode(code) {
  fetch("/api/admin/codes/toggle",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:code})
  }).then(r=>r.json()).then(d=>{loadCodes()});
}

function deleteCode(code) {
  if(!confirm("确定删除激活码 "+code+"？"))return;
  fetch("/api/admin/codes/delete",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:code})
  }).then(r=>r.json()).then(d=>{loadCodes()});
}

function renewCode(code) {
  var days=prompt("续期天数:",30);
  if(!days)return;
  fetch("/api/admin/codes/update",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:code,days:parseInt(days)})
  }).then(r=>r.json()).then(d=>{loadCodes();showToast("已续期 "+days+" 天")});
}

function resetCode(code) {
  if(!confirm("确定重置激活码 "+code+"？重置后可重新使用。"))return;
  fetch("/api/admin/codes/reset",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:code})
  }).then(r=>r.json()).then(d=>{loadCodes();showToast("已重置")});
}

function showToast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}
</script>
</body>
</html>
